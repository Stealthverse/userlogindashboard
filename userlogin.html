<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #eef2ff, #dbeafe);
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
    }

    .login-card {
      width: min(100%, 400px);
      padding: 36px;
      border: 1px solid #e5eaf3;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 20px 50px rgb(31 45 80 / 12%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .intro {
      margin: 0 0 28px;
      color: #667085;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: inherit;
      font: inherit;
    }

    input:focus {
      border-color: #4f46e5;
      outline: 3px solid rgb(79 70 229 / 15%);
    }

    button {
      width: 100%;
      margin-top: 4px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    button:hover {
      background: #4338ca;
    }

    #login-message {
      margin: 18px 0 0;
      color: #15803d;
      font-weight: 700;
      text-align: center;
    }

    #login-message:empty {
      display: none;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Welcome back</h1>
    <p class="intro">Enter your details to log in to your account.</p>

    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button type="submit">Log in</button>
      <p id="login-message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const loginForm = document.querySelector("#login-form");
    const loginMessage = document.querySelector("#login-message");

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      loginMessage.textContent = "Successfully logged in!";
    });
  </script>
</body>
</html>
